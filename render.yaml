services:
  - type: web
    name: placidway-ai-knowledge-assistant
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ANSWER_MODE
        value: extractive
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_FREE_TIER_CONFIRMED
        value: "false"
      - key: ADMIN_API_KEY
        generateValue: true
      - key: GLOBAL_GENERATION_PER_DAY
        value: "150"
